<!DOCTYPE html>
<html>
<head>
    <title>PharmaSearch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-4">
        <h1>PharmaSearch</h1>
        <p class="text-muted">
            Search any active substance across regulatory sources
        </p>
        <p class="badge text-bg-success">UAT build: platform core</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/connector_status_page">Connector Status</a>
            <a class="btn btn-outline-secondary btn-sm" href="/connector_health_page">Connector Health</a>
        </div>
    </div>

    <form action="/search_page" method="get">
        <div class="mb-3">
            <input
                type="text"
                name="substance"
                class="form-control"
                required
                aria-describedby="substance-help"
                placeholder="Enter active substance, e.g. metformin, atorvastatin, semaglutide">
            <div id="substance-help" class="form-text">
                Please enter the active substance name.
            </div>
        </div>

        <input type="hidden" name="live" value="true">
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="page_size" value="50">

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label" for="country">Country filter</label>
                <select class="form-select" id="country" name="country">
                    <option value="">All countries</option>
                    {% for country in country_options %}
                    <option value="{{ country }}">{{ country }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="region">Region filter</label>
                <select class="form-select" id="region" name="region">
                    <option value="">All regions</option>
                    {% for region in region_options %}
                    <option value="{{ region }}">{{ region }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label mb-0">Sources</label>
                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-outline-secondary" id="select-fast-sources">Select fast</button>
                    <button type="button" class="btn btn-outline-secondary" id="select-all-sources">Select all</button>
                    <button type="button" class="btn btn-outline-secondary" id="clear-sources">Clear</button>
                </div>
            </div>
            <div class="row g-2">
                {% for source in sources %}
                <div class="col-md-4 col-lg-3">
                    <div class="form-check">
                        <input
                            class="form-check-input source-checkbox"
                            type="checkbox"
                            name="sources"
                            value="{{ source.name }}"
                            id="source-{{ loop.index }}"
                            data-fast="{% if source.name in fast_background_sources %}true{% else %}false{% endif %}"
                            {% if source.name in fast_background_sources %}checked{% endif %}
                            {% if not source.enabled %}disabled{% endif %}>
                        <label class="form-check-label {% if not source.enabled %}text-muted{% endif %}" for="source-{{ loop.index }}">
                            {{ source.name }}
                            <span class="text-muted">({{ source.region }})</span>
                        </label>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div>
            <button class="btn btn-primary" type="submit" name="search_mode" value="fast">
                Search
            </button>
        </div>
    </form>
</div>

<script>
const country = document.getElementById("country");
const region = document.getElementById("region");
country.addEventListener("change", function () {
    if (country.value) {
        region.value = "";
    }
});
region.addEventListener("change", function () {
    if (region.value) {
        country.value = "";
    }
});
document.getElementById("select-all-sources").addEventListener("click", function () {
    document.querySelectorAll(".source-checkbox:not(:disabled)").forEach(function (input) {
        input.checked = true;
    });
});
document.getElementById("select-fast-sources").addEventListener("click", function () {
    document.querySelectorAll(".source-checkbox:not(:disabled)").forEach(function (input) {
        input.checked = input.dataset.fast === "true";
    });
});
document.getElementById("clear-sources").addEventListener("click", function () {
    document.querySelectorAll(".source-checkbox:not(:disabled)").forEach(function (input) {
        input.checked = false;
    });
});
</script>

</body>
</html>
