<!DOCTYPE html>
<html>
<head>
    <title>PharmaSearch</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="text-center mb-4">
    <h1>PharmaSearch</h1>
    <p class="text-muted">
        Regulatory Intelligence & Active Substance Search Platform
    </p>
</div>
    <form action="/search_page" method="get">

        <div class="mb-3">

            <input
                type="text"
                name="substance"
                class="form-control"
                placeholder="Enter Active Substance">

        </div>

        <button class="btn btn-primary">
            Search
        </button>

    </form>

</div>

</body>
</html>
